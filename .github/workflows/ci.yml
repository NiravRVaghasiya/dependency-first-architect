name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: No-drift checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: No drift between SKILL.md and adapters/
        run: python build.py --check
      - name: SHA256SUMS matches a fresh checkout
        shell: bash
        run: sha256sum -c SHA256SUMS
      - name: Scorecard and README numbers match the raw judge scores
        run: python examples/scoring/tally.py --check
      - name: Committed eval runs, reports, matrix and rubrics are consistent
        run: python eval/run.py check
      - name: Self-tests for the checkers and the eval harness
        run: python -m unittest discover -s tests -v
      - name: Release tag matches VERSION and a dated CHANGELOG entry
        if: startsWith(github.ref, 'refs/tags/v')
        # bash on every OS: PowerShell would not expand ${GITHUB_REF_NAME}.
        shell: bash
        run: python build.py --release-tag "${GITHUB_REF_NAME}"
